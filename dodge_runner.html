<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dodge Runner — простая игра </title>
  <style>
    :root{
      --bg:#0f1226; --fg:#e7ecff; --accent:#7aa2ff; --accent2:#67f3aa; --danger:#ff6b6b;
    }
    html,body{height:100%; margin:0; background:linear-gradient(180deg,#0b0e22,#171a35); color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;}
    #wrap{position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr auto;}
    header,footer{display:flex; align-items:center; justify-content:space-between; padding:10px 14px; backdrop-filter: blur(6px); background:rgba(10,14,30,.35); border-bottom:1px solid rgba(255,255,255,.06)}
    footer{border-top:1px solid rgba(255,255,255,.06); border-bottom:none}
    .title{font-weight:700; letter-spacing:.3px}
    .btn{cursor:pointer; background:var(--accent); color:#0a0d1f; border:none; padding:8px 12px; border-radius:14px; font-weight:700; box-shadow:0 6px 24px rgba(122,162,255,.35); transition:.2s transform}
    .btn:active{transform:scale(.98)}
    .muted{opacity:.8}
    canvas{display:block; width:100%; height:100%; touch-action:none;}
    #overlay{pointer-events:none; position:absolute; inset:0; display:flex; align-items:center; justify-content:center}
    .card{pointer-events:auto; max-width:640px; width:min(92%,640px); background:rgba(15,18,38,.9); border:1px solid rgba(255,255,255,.08); padding:22px; border-radius:18px; box-shadow:0 10px 40px rgba(0,0,0,.35)}
    .row{display:flex; gap:10px; flex-wrap:wrap}
    kbd{background:#111429; border:1px solid rgba(255,255,255,.08); padding:2px 6px; border-radius:6px; font-weight:700}
    .pill{display:inline-block; padding:2px 10px; border-radius:999px; background:rgba(122,162,255,.15); color:#bcd0ff; border:1px solid rgba(122,162,255,.2)}
    .danger{color:var(--danger)}
    .accent{color:var(--accent2)}
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <div class="title">Dodge Runner <span class="pill">v1.0</span></div>
      <div class="muted">Очки: <b id="score">0</b> • Рекорд: <b id="best">0</b></div>
      <button class="btn" id="btnStart" aria-pressed="false">Играть</button>
    </header>

    <div style="position:relative;">
      <canvas id="game" role="img" aria-label="Игровое поле Dodge Runner"></canvas>
      <div id="overlay"></div>
    </div>

    <footer>
      <div class="muted">Управление: <kbd>←</kbd><kbd>→</kbd> или <kbd>A</kbd><kbd>D</kbd> • Прыжок: <kbd>Space</kbd> • Мобильный: свайпы</div>
      <div class="muted">Процедурная генерация препятствий</div>
    </footer>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const btnStart = document.getElementById('btnStart');
  let overlayMode = '';

  function setOverlay(mode, html){
    if(overlayMode !== mode){
      overlayMode = mode;
      overlay.innerHTML = html || '';
    }
  }

  let W = 0, H = 0, DPR = Math.min(2, window.devicePixelRatio || 1);
  function resize(){
    W = canvas.clientWidth; H = Math.max(300, canvas.clientHeight);
    canvas.width = W * DPR; canvas.height = H * DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  const ro = new ResizeObserver(resize); ro.observe(canvas);
  resize();

  const rand = (a,b)=>a + Math.random()*(b-a);
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

  const state = {
    running: false,
    over: false,
    t: 0,
    speed: 180, // px/sec for world scroll
    diff: 0, // difficulty grows with time
    score: 0,
    best: Number(localStorage.getItem('dodgeBest')||0),
  };
  bestEl.textContent = state.best;

  const player = {
    x: 100, y: 0, w: 28, h: 36,
    vy: 0, onGround: false,
    jumpsLeft: 2,
    anim: { sx: 1, sy: 1 },
    color: '#67f3aa'
  };

  const gravity = 1200; // px/sec^2
  const jumpV = 520;
  const maxJumps = 2; // enable double jump
  const lanesY = () => H - 80; // ground level

  const obstacles = []; // rectangles coming from the right
  const coins = [];
  const particles = [];
  let spawnTimer = 0, coinTimer = 0;
  let trailTimer = 0;

  function reset(){
    state.t = 0; state.score = 0; state.diff = 0; state.over = false; spawnTimer = 0; coinTimer = 0;
    obstacles.length = 0; coins.length = 0; player.x = 100; player.y = lanesY()-player.h; player.vy = 0; player.onGround = true; player.jumpsLeft = maxJumps; player.anim.sx = 1; player.anim.sy = 1;
  }

  function startStop(){
    if(state.over){ reset(); }
    state.running = !state.running;
    btnStart.textContent = state.running ? 'Пауза' : 'Играть';
    btnStart.setAttribute('aria-pressed', String(state.running));
    if(state.running){ setOverlay('', ''); lastTs = performance.now(); loop(lastTs); } else { showPauseOverlay(); }
  }

  btnStart.addEventListener('click', startStop);

  // Input
  const keys = new Set();
  window.addEventListener('keydown', e=>{
    const controlKeys = ['Space','ArrowLeft','ArrowRight','KeyA','KeyD'];
    if(controlKeys.includes(e.code)) e.preventDefault();
    const already = keys.has(e.code);
    keys.add(e.code);
    if(e.code==='Space' && !already) jump();
  });
  window.addEventListener('keyup', e=> keys.delete(e.code));

  // Touch controls
  let touchStart = null;
  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); touchStart = e.touches[0]; }, {passive:false});
  canvas.addEventListener('touchend', e=>{ e.preventDefault(); if(!touchStart) return; const t = touchStart; touchStart = null; const dx = (e.changedTouches[0].clientX - t.clientX); const dy = (e.changedTouches[0].clientY - t.clientY); if(Math.abs(dy) < 40 && Math.abs(dx) > 40){ if(dx>0) move(1); else move(-1); } else if(dy < -30){ jump(); } }, {passive:false});

  function move(dir){ player.x += dir * 60; }
  function jump(){
    if(player.jumpsLeft > 0){
      // jump impulse
      player.vy = -jumpV; player.onGround = false; player.jumpsLeft--;
      player.anim.sy += 0.18; player.anim.sx -= 0.18;
      // particles: small burst at feet
      spawnBurst(player.x + player.w/2, lanesY(), 10, 'jump');
    }
  }

  // Procedural generation
  function spawnObstacle(){
    const baseH = rand(20, 60 + state.diff*8);
    const baseW = rand(18, 40 + state.diff*6);
    const y = lanesY() - baseH;
    obstacles.push({x: W + rand(0, 60), y, w: baseW, h: baseH, color: '#7aa2ff'});
  }

  function spawnCoin(){
    const y = lanesY() - rand(80, 160);
    coins.push({x: W + rand(0, 60), y, r: 7, value: 10});
  }

  function rectsOverlap(a,b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  let lastTs = performance.now();
  function loop(ts){
    if(!state.running) return;
    const dt = Math.min(1/30, (ts - lastTs)/1000); // clamp for tab switching
    lastTs = ts; state.t += dt; state.diff = Math.min(5, state.t/10);

    update(dt); draw();
    requestAnimationFrame(loop);
  }

  function update(dt){
    // Speed ramps with difficulty
    const worldSpeed = state.speed * (1 + state.diff*0.35);

    // Player physics
    player.vy += gravity*dt; player.y += player.vy*dt;
    if(player.y + player.h >= lanesY()){
      const wasAir = !player.onGround;
      player.y = lanesY()-player.h; player.vy = 0; player.onGround = true; player.jumpsLeft = maxJumps;
      if(wasAir){
        player.anim.sy -= 0.22; player.anim.sx += 0.22;
        // particles: bigger landing burst
        spawnBurst(player.x + player.w/2, lanesY(), 18, 'land');
      }
    } else {
      player.onGround = false;
    }

    // Animate squash & stretch by vertical velocity
    const vStretch = clamp(1 + (-player.vy)*0.001, 0.9, 1.15);
    const targetSy = vStretch;
    const targetSx = 1 - (targetSy - 1);
    player.anim.sy += (targetSy - player.anim.sy) * 10 * dt;
    player.anim.sx += (targetSx - player.anim.sx) * 10 * dt;
    player.anim.sy = clamp(player.anim.sy, 0.8, 1.25);
    player.anim.sx = clamp(player.anim.sx, 0.8, 1.25);

    // Air trail
    if(!player.onGround){
      trailTimer -= dt;
      if(trailTimer <= 0){
        spawnTrail(player.x + player.w*0.5, player.y + player.h*0.6);
        trailTimer = 0.045;
      }
    } else {
      trailTimer = 0;
    }

    // Update particles
    updateParticles(dt);

    // Horizontal input
    const accel = 520;
    if(keys.has('ArrowLeft')||keys.has('KeyA')) player.x -= accel*dt;
    if(keys.has('ArrowRight')||keys.has('KeyD')) player.x += accel*dt;
    player.x = clamp(player.x, 10, W-10-player.w);

    spawnTimer -= dt; if(spawnTimer<=0){ spawnObstacle(); spawnTimer = rand(0.6, 1.4) / (1 + state.diff*0.25); }
    coinTimer -= dt; if(coinTimer<=0){ spawnCoin(); coinTimer = rand(1.2, 2.0) / (1 + state.diff*0.15); }

    // Move world
    for(const o of obstacles) o.x -= worldSpeed*dt;
    for(const c of coins) c.x -= worldSpeed*dt;

    // Cleanup
    while(obstacles.length && obstacles[0].x + obstacles[0].w < -50) obstacles.shift();
    while(coins.length && coins[0].x + coins[0].r < -50) coins.shift();

    // Collisions
    const pRect = {x:player.x, y:player.y, w:player.w, h:player.h};
    for(const o of obstacles){ if(rectsOverlap(pRect, o)){ gameOver(); return; } }

    for(let i=coins.length-1;i>=0;i--){ const c=coins[i]; const coinRect = {x:c.x-c.r, y:c.y-c.r, w:c.r*2, h:c.r*2}; if(rectsOverlap(pRect, coinRect)){ state.score += c.value; coins.splice(i,1); }}

    // Scoring for survival
    state.score += dt*3*(1+state.diff);
    scoreEl.textContent = Math.floor(state.score);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // Parallax background stars
    const t = state.t;
    for(let i=0;i<60;i++){
      const x = (i*73 + (t*20))% (W+100) - 50;
      const y = (i*97 % H);
      ctx.globalAlpha = 0.2 + (i%5)/10;
      ctx.fillStyle = '#bcd0ff';
      ctx.fillRect(x, y*0.6, 2, 2);
    }
    ctx.globalAlpha = 1;

    // Ground
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    ctx.fillRect(0, lanesY(), W, 6);

    // Player-related visuals
    drawParticles(ctx);
    drawShadow(ctx);
    drawPlayer(ctx);

    // Obstacles
    for(const o of obstacles){ ctx.fillStyle = o.color; roundRect(ctx, o.x, o.y, o.w, o.h, 6); }

    // Coins
    ctx.fillStyle = '#ffd76a';
    for(const c of coins){ ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(c.x, c.y, c.r-2, 0, Math.PI*2); ctx.stroke(); }

    // Overlay states
    if(state.over){
      showOverlay();
    } else if(!state.running){
      showPauseOverlay();
    } else {
      setOverlay('', '');
    }
  }

  function showOverlay(){
    const s = Math.floor(state.score);
    setOverlay('over', `
      <div class="card">
        <h2 style="margin:.2em 0 0">Игра окончена</h2>
        <p class="muted" style="margin:.2em 0 1em">Ваш счёт: <b class="accent">${s}</b> · Рекорд: <b>${state.best}</b></p>
        <div class="row" style="margin-bottom:10px">
          <button class="btn" onclick="location.reload()">Перезапустить</button>
          <button class="btn" style="background:var(--accent2); box-shadow:0 6px 24px rgba(103,243,170,.35)" onclick="window._restart()">Играть ещё</button>
        </div>
        <p class="muted">Совет: собирайте монеты и прыгайте через препятствия. Сложность растёт со временем.</p>
      </div>`);
  }

  function drawPlayer(ctx){
    ctx.save();
    const cx = player.x + player.w/2; const cy = player.y + player.h/2;
    ctx.translate(cx, cy);
    ctx.scale(player.anim.sx, player.anim.sy);
    ctx.fillStyle = player.color;
    roundRect(ctx, -player.w/2, -player.h/2, player.w, player.h, 6);
    ctx.restore();
  }

  function drawShadow(ctx){
    const groundY = lanesY();
    const altitude = clamp(groundY - (player.y + player.h), 0, 140);
    const n = altitude / 140;
    const rx = 14 * (1 - 0.5*n);
    const ry = 5 * (1 - 0.7*n);
    const cx = player.x + player.w/2;
    ctx.save();
    ctx.globalAlpha = 0.28 * (1 - 0.85*n);
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(cx, groundY + 4, Math.max(2, rx), Math.max(1, ry), 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // --- Particles ---
  function spawnBurst(x, y, count, kind){
    for(let i=0;i<count;i++){
      const a = rand(-Math.PI, 0); // upwards hemisphere
      const speed = kind==='land' ? rand(120, 260) : rand(80, 180);
      const vx = Math.cos(a) * speed + rand(-30,30);
      const vy = Math.sin(a) * speed;
      const life = rand(0.35, 0.7) * (kind==='land' ? 1.1 : 1);
      const size = kind==='land' ? rand(2,4) : rand(1.5,3);
      const hue = kind==='land' ? 220 : 150; // bluish for dust, greenish for jump tint
      const sat = kind==='land' ? 30 : 60;
      const light = kind==='land' ? 85 : 70;
      particles.push({x, y, vx, vy: vy*-1, life, ttl: life, size, hue, sat, light, g: 520, drag: 1.8});
    }
  }

  function spawnTrail(x, y){
    const vx = rand(-60, -20);
    const vy = rand(-20, 20);
    const life = rand(0.25, 0.45);
    const size = rand(1.2, 2.2);
    particles.push({x, y, vx, vy, life, ttl: life, size, hue: 160, sat: 60, light: 75, g: 0, drag: 1.5});
  }

  function updateParticles(dt){
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vy += p.g * dt;
      p.vx *= Math.exp(-p.drag*dt);
      p.vy *= Math.exp(-p.drag*dt*0.5);
      p.x += p.vx*dt;
      p.y += p.vy*dt;
      p.life -= dt;
      if(p.life <= 0) particles.splice(i,1);
    }
  }

  function drawParticles(ctx){
    for(const p of particles){
      const a = Math.max(0, p.life / p.ttl);
      ctx.globalAlpha = Math.min(0.9, a);
      ctx.fillStyle = `hsl(${p.hue} ${p.sat}% ${p.light}%)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function showPauseOverlay(){
    setOverlay('pause', `
      <div class="card">
        <h2 style="margin:.2em 0 0">Пауза</h2>
        <div class="row" style="margin-top:10px">
          <button class="btn" onclick="window._resume()">Продолжить</button>
          <button class="btn" style="background:var(--accent2); box-shadow:0 6px 24px rgba(103,243,170,.35)" onclick="window._restart()">Начать заново</button>
        </div>
      </div>`);
  }

  function gameOver(){
    state.over = true; state.running = false; const s=Math.floor(state.score); if(s>state.best){ state.best = s; localStorage.setItem('dodgeBest', String(s)); bestEl.textContent = s; }
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath(); ctx.fill();
  }

  window._restart = () => { reset(); state.running = true; lastTs = performance.now(); loop(lastTs); };
  window._resume = () => { if(!state.running && !state.over){ startStop(); } };

  // Start screen
  reset();
  setOverlay('start', `
    <div class="card">
      <h2 style="margin:.2em 0 .6em">Dodge Runner</h2>
      <p class="muted">Уклоняйтесь от препятствий и собирайте монеты. Препятствия генерируются <b>процедурно</b>, сложность растёт с течением времени.</p>
      <ul style="margin:.6em 0 1em; line-height:1.6">
        <li>Движение: <kbd>←</kbd> / <kbd>→</kbd> или <kbd>A</kbd> / <kbd>D</kbd></li>
        <li>Прыжок и двойной прыжок: <kbd>Space</kbd></li>
        <li>Мобильный: свайп влево/вправо, свайп вверх — прыжок</li>
      </ul>
      <div class="row">
        <button class="btn" onclick="window._restart()">Начать игру</button>
      </div>
    </div>`);
})();
</script>
</body>
</html>
